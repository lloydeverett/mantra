[package]
name = "mantra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Mantra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specialfx = { git = "https://github.com/lloydeverett/specialfx", rev = "0e2f0801c0f1236fc8537c7a05df1d26fee6158a", default-features = false }
tauri = { version = "2", features = ["macos-private-api"] }

# Win32 for the "Always on top" system menu item. The version Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The dock menu's snooze items: muda builds them, as it does Tauri's menus, and
# objc2 hands them to AppKit. The versions Tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
objc2 = "0.6"
