[package]
name = "mantra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Mantra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specialfx = { git = "https://github.com/lloydeverett/specialfx", rev = "0e2f0801c0f1236fc8537c7a05df1d26fee6158a", default-features = false }
tauri = { version = "2", features = ["macos-private-api"] }
