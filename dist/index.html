<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mantra</title>
<style>
  /* Variable fonts, Latin subset from Google Fonts. OFL licences alongside in fonts/. */
  @font-face {
    font-family: "Archivo";
    src: url(fonts/Archivo.woff2) format("woff2");
    font-weight: 400 700;
  }
  @font-face {
    font-family: "Fraunces";
    src: url(fonts/Fraunces.woff2) format("woff2");
    font-weight: 400 700;
  }

  /* Tokens from Ink & Paper: https://github.com/lloydeverett/ink-and-paper */
  :root {
    --background: #eaeae8;
    --foreground: #1a1a19;
    --muted-foreground: #6b6b69;
    --destructive: #b3261e;
    --border: rgba(26, 26, 25, 0.16);
    --ghost: color-mix(in srgb, var(--foreground) 22%, transparent);
    --font-sans: "Archivo", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-serif: "Fraunces", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141413;
      --foreground: #ebebe9;
      --muted-foreground: #9a9a97;
      --destructive: #e5726a;
      --border: rgba(235, 235, 233, 0.16);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }

  header {
    position: fixed;
    inset: 0 0 auto;
    display: flex;
    justify-content: space-between;
    padding: 1.5rem 1.75rem;
  }

  main {
    height: 100%;
    display: grid;
    place-items: center;
    /* Clears the fixed header. Shrinks on short windows so content stays centred. */
    padding: clamp(3.25rem, 11vh, 4rem) 1.5rem;
  }

  /* Both views share one grid cell and crossfade. */
  .view {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
  }
  [data-view="typing"] #typing,
  [data-view="resting"] #resting {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: .25s, .25s, 0s;
  }

  /* Typing */
  .mantra {
    margin: 1.25rem 0 0;
    max-width: 18ch;
    font-family: var(--font-serif);
    font-size: clamp(2.1rem, 6.4vw, 4rem);
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.1;
    text-wrap: balance;
    color: var(--ghost);
  }
  .ch { position: relative; transition: color .35s ease; }
  .ch.inked { color: var(--foreground); }
  .ch.current::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 0.12em;
    bottom: 0.06em;
    width: 2px;
    background: var(--foreground);
    animation: blink 1.1s steps(1) infinite;
  }
  .ch.miss { animation: miss .5s ease-out; }
  .mantra.shake { animation: shake .28s ease-in-out; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes miss { from { color: var(--destructive); } }
  @keyframes shake {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .rule {
    position: relative;
    width: min(12rem, 40vw);
    height: 1px;
    margin-top: 2.25rem;
    background: var(--border);
  }
  .rule::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--foreground);
    transform: scaleX(var(--p, 0));
    transform-origin: left;
    transition: transform .3s ease;
  }

  /* Resting */
  .ring {
    position: relative;
    width: clamp(11rem, 34vmin, 16rem);
    aspect-ratio: 1;
    margin-top: 1.75rem;
  }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; }
  .ring .track { stroke: var(--border); stroke-width: 0.6; }
  .ring .arc { stroke: var(--foreground); stroke-width: 1.2; stroke-linecap: round; }
  .clock {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 0.4rem;
  }
  .clock .time {
    font-size: clamp(2.5rem, 9vmin, 3.75rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .echo {
    margin: 2rem 0 0;
    max-width: 24ch;
    font-family: var(--font-serif);
    font-size: clamp(1.4rem, 3.4vw, 2rem);
    font-weight: 600;
    line-height: 1.3;
    text-wrap: balance;
    color: color-mix(in srgb, var(--foreground) 78%, transparent);
  }
  .skip {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    margin-top: 1.75rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: none;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }
  .skip:hover, .skip:focus-visible { color: var(--foreground); border-color: var(--foreground); outline: none; }
  .skip svg { width: 1rem; height: 1rem; fill: currentColor; }
  .skip.zoom svg { animation: zoom .7s ease-in-out; }
  /* The chevrons whoosh out to the right and slide back in from the left. */
  @keyframes zoom {
    40% { transform: translateX(10px); opacity: 0; }
    41% { transform: translateX(-10px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <span class="kicker">Mantra</span>
  <span class="kicker" id="round"></span>
</header>

<main>
  <section class="view" id="typing">
    <span class="kicker">Type the mantra</span>
    <p class="mantra" id="mantra" role="img"></p>
    <div class="rule" id="rule"></div>
  </section>

  <section class="view" id="resting">
    <span class="kicker">Sit with it</span>
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46" />
        <circle class="arc" id="arc" cx="50" cy="50" r="46" />
      </svg>
      <div class="clock">
        <span class="time" id="clock"></span>
        <span class="kicker">remaining</span>
      </div>
    </div>
    <p class="echo" id="echo"></p>
    <button class="skip" id="skip" type="button" title="Skip break" aria-label="Skip break">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6l8 6-8 6zM12 6l8 6-8 6z" />
      </svg>
    </button>
  </section>
</main>

<script>
  // Marcus Aurelius, Meditations, in George Long's public-domain translation
  // (Project Gutenberg #15877), with "thou/thy" modernised to "you/your". Cited as book.section.
  // Plain ASCII only, so every character can be typed on a standard keyboard.
  const MANTRAS = [
    "Confine yourself to the present.",                                    // 7.29
    "Wipe out the imagination. Stop the pulling of the strings.",          // 7.29
    "Attend to the matter which is before you.",                           // 8.22
    "Direct your attention to what is said.",                              // 7.30
    "Take pleasure in one thing and rest in it.",                          // 6.7
    "Occupy yourself with few things.",                                    // 4.24
    "Do not be whirled about.",                                            // 4.22
    "Let nothing else distract you.",                                      // 8.1
    "Throw away your books; no longer distract yourself.",                 // 2.2
    "Retire into yourself.",                                               // 7.28
    "Look within. Within is the fountain of good.",                        // 7.59
    "The soul is dyed by the thoughts.",                                   // 5.16
    "Do every act of your life as if it were the last.",                   // 2.5
    "Let not future things disturb you.",                                  // 7.8
    "Do not disturb yourself by thinking of the whole of your life.",      // 8.36
    "Every man lives the present time only, and loses only this.",         // 12.26
    "Do not waste the remainder of your life in thoughts about others.",   // 3.4
  ];
  const REST_SECONDS = 60;
  const FF_MS = 700; // how long the skip button takes to spin the clock down

  const $ = (id) => document.getElementById(id);
  const text = $("mantra"), rule = $("rule"), arc = $("arc"), clock = $("clock");

  const C = 2 * Math.PI * arc.r.baseVal.value;
  arc.style.strokeDasharray = C;

  let mantra, chars, phase, pos, spans, deadline, ff, round = 0;

  function startTyping() {
    // New mantra each round, never the same one twice in a row.
    const others = MANTRAS.filter((m) => m !== mantra);
    mantra = others[Math.floor(Math.random() * others.length)];
    chars = Array.from(mantra);
    text.setAttribute("aria-label", mantra);
    phase = "typing";
    pos = 0;
    spans = chars.map((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.setAttribute("aria-hidden", "true");
      return s;
    });
    text.replaceChildren(...spans);
    spans[0].classList.add("current");
    rule.style.setProperty("--p", 0);
    $("round").textContent = `Round ${String(++round).padStart(2, "0")}`;
    document.body.dataset.view = "typing";
  }

  // Re-trigger a CSS animation even if the class is already present.
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  addEventListener("keydown", (e) => {
    if (phase !== "typing" || e.ctrlKey || e.metaKey) return;
    if (e.key === "Backspace") {
      e.preventDefault();
      if (pos === 0) return;
      spans[pos].classList.remove("current", "miss");
      spans[--pos].classList.remove("inked");
      spans[pos].classList.add("current");
      rule.style.setProperty("--p", pos / chars.length);
      return;
    }
    if (e.repeat || e.key.length !== 1) return;
    e.preventDefault();
    const s = spans[pos];
    if (e.key.toLowerCase() !== chars[pos].toLowerCase()) {
      replay(s, "miss");
      replay(text, "shake");
      return;
    }
    s.classList.remove("current", "miss");
    s.classList.add("inked");
    rule.style.setProperty("--p", ++pos / chars.length);
    if (pos < chars.length) spans[pos].classList.add("current");
    else {
      phase = "done";
      setTimeout(startRest, 900);
    }
  });

  function startRest() {
    phase = "resting";
    $("echo").textContent = `“${mantra}”`;
    deadline = Date.now() + REST_SECONDS * 1000;
    ff = null;
    document.body.dataset.view = "resting";
    tick();
  }

  // Driven by a wall-clock deadline, so it stays correct if frames are paused while hidden.
  function tick() {
    let left = Math.max(0, deadline - Date.now());
    if (ff) {
      // Fast-forwarding: race the remaining time down to zero, accelerating as it goes.
      const t = Math.min(1, (Date.now() - ff.at) / FF_MS);
      left = Math.min(left, ff.from * (1 - t * t));
    }
    arc.style.strokeDashoffset = (C * left) / (REST_SECONDS * 1000);
    const s = Math.ceil(left / 1000);
    clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    if (left > 0) requestAnimationFrame(tick);
    else setTimeout(startTyping, 900);
  }

  $("skip").addEventListener("click", (e) => {
    e.currentTarget.blur(); // so a later Space can't press it again
    if (phase !== "resting" || ff) return;
    replay(e.currentTarget, "zoom");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) deadline = Date.now();
    else ff = { from: Math.max(0, deadline - Date.now()), at: Date.now() };
  });

  startTyping();
</script>
</body>
</html>
