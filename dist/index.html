<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mantra</title>
<style>
  /* Variable fonts, Latin subset from Google Fonts. OFL licences alongside in fonts/. */
  @font-face {
    font-family: "Archivo";
    src: url(fonts/Archivo.woff2) format("woff2");
    font-weight: 400 700;
  }
  @font-face {
    font-family: "Fraunces";
    src: url(fonts/Fraunces.woff2) format("woff2");
    font-weight: 400 700;
  }

  /* Tokens from Ink & Paper: https://github.com/lloydeverett/ink-and-paper */
  :root {
    --background: #eaeae8;
    --foreground: #1a1a19;
    --muted-foreground: #6b6b69;
    --destructive: #b3261e;
    --border: rgba(26, 26, 25, 0.16);
    --ghost: color-mix(in srgb, var(--foreground) 22%, transparent);
    --accent: #2b5f8c;
    --font-sans: "Archivo", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-serif: "Fraunces", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141413;
      --foreground: #ebebe9;
      --muted-foreground: #9a9a97;
      --destructive: #e5726a;
      --border: rgba(235, 235, 233, 0.16);
      --accent: #8db8de;
    }
  }

  * { box-sizing: border-box; }
  html, body, mantra-app { height: 100%; }
  mantra-app { display: block; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }

  main {
    height: 100%;
    display: grid;
    /* One cell no bigger than the padded window, so a view can't push past its edges. */
    grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    place-items: center;
    /* Keeps a gap from the window's edges, smaller on short windows. */
    padding: clamp(3.25rem, 11vh, 4rem) 1.5rem;
  }

  /* The views share one grid cell and crossfade. */
  .view {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-height: 100%;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
  }
  [data-view="typing"] mantra-typing,
  [data-view="prompt"] commitment-prompt,
  [data-view="session"] session-timer {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: .25s, .25s, 0s;
  }

  /* Typing */
  .mantra {
    margin: 1.25rem 0 0;
    max-width: 18ch;
    font-family: var(--font-serif);
    font-size: clamp(2.1rem, 6.4vw, 4rem);
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.1;
    text-wrap: balance;
    color: var(--ghost);
  }
  .ch { position: relative; transition: color .35s ease; }
  .ch.inked { color: var(--foreground); }
  .ch.current::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 0.12em;
    bottom: 0.06em;
    width: 2px;
    background: var(--foreground);
    animation: blink 1.1s steps(1) infinite;
  }
  .ch.miss { animation: miss .5s ease-out; }
  .mantra.shake { animation: shake .28s ease-in-out; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes miss { from { color: var(--destructive); } }
  @keyframes shake {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .rule {
    position: relative;
    width: min(12rem, 40vw);
    height: 1px;
    margin-top: 2.25rem;
    background: var(--border);
  }
  .rule::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--foreground);
    transform: scaleX(var(--p, 0));
    transform-origin: left;
    transition: transform .3s ease;
  }

  /* Commitment prompt */
  .entry {
    min-height: 1.3em;
    max-width: 24ch;
    margin: 1.25rem 0 0;
    font-family: var(--font-serif);
    font-size: clamp(1.6rem, 4.4vw, 2.5rem);
    font-weight: 600;
    line-height: 1.3;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-wrap: balance;
    caret-color: var(--foreground);
    outline: none;
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
  }
  .entry:empty::before { content: attr(data-placeholder); color: var(--ghost); }
  /* The entry is only as wide as its placeholder, so this puts the caret at its start. */
  .entry:empty { text-align: left; }
  ::highlight(duration) { color: var(--accent); }
  .rule.drain::after {
    --p: 1; /* stays full when motion is reduced */
    animation: drain var(--t) linear forwards;
  }
  @keyframes drain { to { transform: scaleX(0); } }
  .presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    max-width: 34rem;
    margin-top: 2rem;
  }
  .preset {
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: none;
    color: var(--muted-foreground);
    font: 600 0.8rem var(--font-mono);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }
  .preset:hover { color: var(--foreground); border-color: var(--foreground); }
  .preset[aria-checked="true"] { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
  .preset .auto { opacity: 0.6; }

  /* Session */
  /* Shrinks, to a point, when the window is too short for it and the commitment. */
  .ring {
    position: relative;
    flex: 0 1 clamp(11rem, 34vmin, 16rem);
    min-height: 6rem;
    aspect-ratio: 1;
    margin-top: 1.75rem;
    container-type: size;
  }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; }
  .ring .track { stroke: var(--border); stroke-width: 0.6; }
  .ring .arc { stroke: var(--foreground); stroke-width: 1.2; stroke-linecap: round; }
  .clock {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 0.4rem;
  }
  .clock .time {
    font-size: min(24cqw, 3.75rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .echo {
    margin: 2rem 0 0;
    max-width: 24ch;
    font-family: var(--font-serif);
    font-size: clamp(1.4rem, 3.4vw, 2rem);
    font-weight: 600;
    line-height: 1.3;
    text-wrap: balance;
    color: color-mix(in srgb, var(--foreground) 78%, transparent);
  }
  .end-session {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    margin-top: 1.75rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: none;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }
  .end-session:hover, .end-session:focus-visible { color: var(--foreground); border-color: var(--foreground); outline: none; }
  .end-session svg { width: 1rem; height: 1rem; fill: currentColor; }
  .end-session.zoom svg { animation: zoom .7s ease-in-out; }
  /* The chevrons whoosh out to the right and slide back in from the left. */
  @keyframes zoom {
    40% { transform: translateX(10px); opacity: 0; }
    41% { transform: translateX(-10px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<mantra-app></mantra-app>
<script type="module" src="app.js"></script>
</body>
</html>
